        function cycleLanguage() {
            if (currentLanguage === 'ar') currentLanguage = 'en';
            else if (currentLanguage === 'en') currentLanguage = 'ru';
            else currentLanguage = 'ar';
            renderPolicy();
        }

        function renderPolicy() {
            const data = content[currentLanguage];

            document.documentElement.setAttribute('dir', data.dir);
            document.documentElement.setAttribute('lang', currentLanguage);
            document.title = data.metaTitle;

            document.getElementById('langText').innerText = data.langName;
            document.getElementById('policyHeaderTitle').innerText = data.headerTitle;
            document.getElementById('policyHeaderSubtitle').innerText = data.headerSubtitle;
            document.getElementById('backToAppText').innerText = data.backToApp;
            document.getElementById('backToAppIcon').className = data.dir === 'rtl' ? 'fa-solid fa-arrow-right' : 'fa-solid fa-arrow-left';
            document.getElementById('lastUpdatedLabel').innerText = data.lastUpdatedLabel;
            document.getElementById('lastUpdatedValue').innerText = data.lastUpdatedValue;
            document.getElementById('txtDevBy').innerText = data.developedBy;

            const main = document.getElementById('policyContent');
            main.innerHTML = '';

            data.sections.forEach((sec) => {
                const panel = document.createElement('section');
                panel.className = 'w-full bg-tactical-panel border border-tactical-border rounded-2xl p-4 sm:p-5 shadow-xl';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'flex items-center gap-2 mb-3 border-b border-tactical-border pb-2';
                const iconEl = document.createElement('i');
                iconEl.className = sec.icon + ' text-tactical-accent text-base';
                const titleEl = document.createElement('h2');
                titleEl.className = 'text-sm sm:text-base font-bold text-white';
                titleEl.textContent = sec.title;
                headerDiv.appendChild(iconEl);
                headerDiv.appendChild(titleEl);
                panel.appendChild(headerDiv);

                sec.body.forEach((p) => {
                    const para = document.createElement('p');
                    para.className = 'policy-p text-sm text-gray-300 mb-2 last:mb-0';
                    para.textContent = p;
                    panel.appendChild(para);
                });

                if (sec.items) {
                    const list = document.createElement('div');
                    list.className = 'space-y-2 mt-3';
                    sec.items.forEach((item) => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'bg-black/40 border border-tactical-border/70 rounded-xl p-3';

                        const subHead = document.createElement('div');
                        subHead.className = 'flex items-center gap-2 text-xs font-bold text-tactical-amber font-mono mb-1.5';
                        const subIcon = document.createElement('i');
                        subIcon.className = item.icon;
                        const subTitle = document.createElement('span');
                        subTitle.textContent = item.subtitle;
                        subHead.appendChild(subIcon);
                        subHead.appendChild(subTitle);

                        const subText = document.createElement('p');
                        subText.className = 'policy-p text-sm text-gray-300';
                        subText.textContent = item.text;

                        itemDiv.appendChild(subHead);
                        itemDiv.appendChild(subText);
                        list.appendChild(itemDiv);
                    });
                    panel.appendChild(list);
                }

                main.appendChild(panel);
            });
        }
